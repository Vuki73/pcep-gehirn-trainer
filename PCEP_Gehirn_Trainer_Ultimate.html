<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🐍 PCEP Gehirn-Trainer Ultimate – Kohlenstoffeinheiten-Edition (200 Fragen)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12141d; --panel:#1b1f2e; --panel2:#24293e; --line:#353c5999;
  --ink:#eef0f7; --mute:#9aa1bb; --yellow:#ffd23f; --blue:#4c9aff;
  --green:#3ddc84; --red:#ff5d73; --purple:#b388ff; --orange:#ff9f43; --cyan:#26c6da;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,'Segoe UI',system-ui,sans-serif;font-size:16px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 70px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 16px}
.logo{font-family:Fredoka,'Segoe UI',sans-serif;font-weight:700;font-size:24px;letter-spacing:.2px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px}
.logo span{color:var(--yellow)}
.logo .sub{font-size:11px;background:#ffd23f22;color:var(--yellow);border:1px solid #ffd23f55;padding:2px 8px;border-radius:999px;font-weight:700}
.spacer{flex:1}
.rank-pill{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);padding:5px 11px;border-radius:999px;font-size:13px;font-weight:700}
.streak-pill{display:flex;align-items:center;gap:4px;background:#ff9f4322;border:1px solid #ff9f4355;color:var(--orange);padding:5px 10px;border-radius:999px;font-size:13px;font-weight:800}
.seg{display:flex;background:var(--bg);border-radius:999px;padding:3px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;color:var(--mute);padding:5px 11px;border-radius:999px;font-weight:700;font-size:13px;transition:.15s}
.seg button.on{background:var(--yellow);color:#1a1a1a}
.de-toggle{border:1px solid var(--line);background:var(--panel2);color:var(--mute);padding:6px 11px;border-radius:999px;font-weight:700;font-size:13px;transition:.15s}
.de-toggle.on{background:#26c6da22;border-color:var(--cyan);color:var(--cyan)}
h1,h2,h3{font-family:Fredoka,'Segoe UI',sans-serif;font-weight:600;margin:0}
.hero{background:linear-gradient(135deg,#262b46,#191c2b);border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:18px;position:relative;overflow:hidden}
.hero h1{font-size:27px;margin-bottom:6px}
.hero p{margin:0;color:var(--mute);font-size:15px}
.verinfo{margin-top:12px;font-size:13.5px;color:var(--mute);background:#0005;border:1px solid #ffffff12;border-radius:12px;padding:10px 14px;line-height:1.55}
.verinfo b{color:var(--ink)}
.rank-box{margin-top:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#ffffff08;border-radius:12px;padding:10px 14px;font-size:13.5px}
.rank-box .rbar{flex:1;min-width:140px;height:8px;background:#0006;border-radius:9px;overflow:hidden}
.rank-box .rbar i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--green));border-radius:9px;transition:width .3s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;color:var(--ink);transition:transform .12s,border-color .12s;display:flex;flex-direction:column;justify-content:space-between}
button.card:hover:not(:disabled){transform:translateY(-2px);border-color:var(--yellow)}
.card .t{font-family:Fredoka,'Segoe UI',sans-serif;font-size:18px;font-weight:600;display:flex;gap:8px;align-items:center;justify-content:space-between}
.card .d{color:var(--mute);font-size:13.5px;margin-top:5px}
.bar{height:8px;background:#0006;border-radius:9px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:9px;transition:width .3s}
.section-t{margin:22px 0 10px;font-family:Fredoka,'Segoe UI',sans-serif;font-size:14px;color:var(--mute);text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;justify-content:space-between}
.big{grid-column:1/-1}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--panel2);color:var(--mute)}
.pill.trap{background:#ff9f4322;color:var(--orange);border:1px solid #ff9f4344}
.pill.b1{color:#7cc4ff;background:#7cc4ff18}.pill.b2{color:#ffd23f;background:#ffd23f18}.pill.b3{color:#3ddc84;background:#3ddc8418}.pill.b4{color:#ff8fa3;background:#ff8fa318}.pill.b5{color:#b388ff;background:#b388ff18}
/* quiz */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.prog{flex:1;min-width:120px;height:10px;background:var(--panel);border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--yellow);transition:width .3s}
.score{font-family:Fredoka,'Segoe UI',sans-serif;font-weight:600;background:var(--panel);padding:5px 12px;border-radius:10px;border:1px solid var(--line);font-size:14px}
.timer{font-family:'JetBrains Mono',Consolas,monospace;font-weight:600;background:var(--panel);padding:5px 12px;border-radius:10px;border:1px solid var(--line)}
.timer.low{color:var(--red);border-color:var(--red)}
.qbox{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.qp{font-size:18.5px;font-weight:700;margin:12px 0 8px}
.qde{margin:0 0 12px;padding:10px 13px;border-radius:12px;background:#26c6da16;border:1px solid #26c6da44;color:#a8f0f8;font-size:14.5px;font-weight:600}
pre.code{background:#0b0d14;border:1px solid #2b3047;border-radius:12px;padding:14px 16px;margin:0 0 14px;font-family:'JetBrains Mono',Consolas,monospace;font-size:15px;line-height:1.55;overflow-x:auto;white-space:pre}
.kw{color:#c792ea;font-weight:600}.st{color:#c3e88d}.nu{color:#f78c6c}.co{color:#6b7394;font-style:italic}.bi{color:#82aaff}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--panel2);border:2px solid transparent;border-radius:14px;padding:12px 14px;color:var(--ink);font-size:16px;transition:border-color .1s,transform .1s;width:100%}
.opt:hover:not([disabled]){border-color:var(--blue);transform:translateX(3px)}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;background:#0005;display:grid;place-items:center;font-family:Fredoka,'Segoe UI',sans-serif;font-weight:600}
.opt .v{font-family:'JetBrains Mono',Consolas,monospace;font-size:15px;white-space:pre-wrap;word-break:break-word;padding-top:2px;flex:1}
.opt .v .el{color:var(--mute);font-style:italic;font-family:Nunito,sans-serif}
.opt .v .ode{display:block;font-family:Nunito,sans-serif;font-size:13px;color:var(--cyan);margin-top:3px;font-weight:600}
.opt.sel{border-color:var(--blue);background:#4c9aff15}
.opt.right{border-color:var(--green);background:#3ddc8418}
.opt.wrong{border-color:var(--red);background:#ff5d7318}
.opt[disabled]{cursor:default}
.fb{margin-top:16px;border-radius:16px;padding:16px;animation:pop .25s ease}
.fb.ok{background:#3ddc8414;border:1px solid #3ddc8466}
.fb.no{background:#ff5d7314;border:1px solid #ff5d7366}
.fb .head{font-family:Fredoka,'Segoe UI',sans-serif;font-size:20px;font-weight:600;margin-bottom:8px}
.fb .row{display:flex;gap:10px;margin-top:10px;background:#0003;padding:10px 12px;border-radius:12px}
.fb .row .ic{flex:none;font-size:22px}
.fb .lbl{font-weight:800;font-size:12px;color:var(--yellow);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;font-size:14.5px;background:var(--panel2);color:var(--ink);transition:.15s}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn.main{background:var(--yellow);color:#1a1a1a}
.btn.cyan{background:#26c6da22;border:1px solid #26c6da66;color:#9ef5ff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--mute)}
.btn:disabled{opacity:.4;cursor:default}
.hint{color:var(--mute);font-size:13px;margin-top:10px}
.navdots{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}
.navdots button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--mute);font-size:12px;font-weight:700}
.navdots button.ans{background:var(--panel2);color:var(--ink)}
.navdots button.cur{border-color:var(--yellow);color:var(--yellow)}
.navdots button.flag{box-shadow:inset 0 -3px 0 var(--orange)}
.result{text-align:center;padding:26px 18px}
.result .pct{font-family:Fredoka,'Segoe UI',sans-serif;font-size:64px;font-weight:700;line-height:1}
.result .verdict{font-family:Fredoka,'Segoe UI',sans-serif;font-size:24px;margin:8px 0}
.breaks{display:grid;gap:8px;margin:16px 0;text-align:left}
.brow{display:flex;align-items:center;gap:10px}
.brow .n{width:190px;font-size:14px;color:var(--mute)}
.brow .bar{flex:1;margin:0}
.review{margin-top:14px}
.ritem{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.cheat{display:grid;gap:10px}
.cheat .ci{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.cheat .ci .no{font-family:Fredoka,'Segoe UI',sans-serif;font-weight:700;color:var(--yellow);font-size:18px;width:28px;flex:none}
.cheat code{font-family:'JetBrains Mono',Consolas,monospace;background:#0b0d14;padding:2px 6px;border-radius:6px;font-size:13.5px;color:#ffd23f}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--mute);padding:8px 14px;border-radius:12px;font-weight:700;font-size:14px}
.tabs button.on{background:var(--yellow);color:#1a1a1a;border-color:var(--yellow)}
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:10px}
.vcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.vcard .en{font-family:'JetBrains Mono',Consolas,monospace;color:var(--yellow);font-size:13.5px;font-weight:600}
.vcard .de{color:var(--ink);font-size:14px;margin-top:4px}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:10;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:440px;width:100%}
@media (max-width:560px){.hero h1{font-size:22px}.qp{font-size:16px}pre.code{font-size:13.5px}.brow .n{width:120px}.vocab-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

  <header>
    <div class="logo" id="logo">🐍 PCEP <span>Gehirn-Trainer</span> <span class="sub">ULTIMATE 200</span></div>

    <div class="streak-pill" id="streakPill" title="Aktuelle Serie richtiger Antworten">🔥 0</div>

    </div>
  </header>
  <main id="app"></main>
</div>

const BANK = [{"b": 1, "code": "print(7 / 7)", "p": "What is the output of the following code?", "o": ["1", "1.0", "7/7", "Error"], "a": 1, "kid": "Der Schrägstrich / ist ein Zauberer, der IMMER eine Kommazahl rausspuckt – auch wenn's glatt aufgeht.", "tech": "/ ist die echte Division und liefert in Python 3 immer float. 7/7 → 1.0", "trap": true, "run": true, "v": "both", "id": 0, "de": "Was gibt der folgende Code auf dem Bildschirm aus?"}, {"b": 1, "code": "print(7 // 2)", "p": "What is the output of the following code?", "o": ["3.5", "3", "4", "3.0"], "a": 1, "kid": "// heißt: teilen und alles hinter dem Komma wegschmeißen. 7 Bonbons auf 2 Kinder = jeder 3 ganze.", "tech": "// ist Floor-Division. Bei zwei ints kommt int raus: 3.", "trap": false, "run": true, "v": "both", "id": 1, "de": "Was gibt der folgende Code auf dem Bildschirm aus?"}, {"b": 1, "code": "print(-7 // 2)", "p": "What is the output of the following code?", "o": ["-3", "-4", "-3.5", "3"], "a": 1, "kid": "// rundet immer NACH UNTEN auf dem Zahlenstrahl – und unter -3.5 liegt -4, nicht -3!", "tech": "Floor-Division rundet Richtung minus unendlich: floor(-3.5) = -4.", "trap": true, "run": true, "v": "both", "id": 2, "de": "Was gibt der folgende Code auf dem Bildschirm aus?"}, {"b": 1, "code": "print(7 % 3)", "p": "What is the output of the following code?", "o": ["2", "1", "0", "2.33"], "a": 1, "kid": "% ist der Rest-Detektiv: 7 Kekse, immer 3er-Päckchen → 1 Keks bleibt übrig.", "tech": "Modulo liefert den Rest der Ganzzahldivision: 7 = 2*3 + 1.", "trap": false, "run": true, "v": "both", "id": 3, "de": "Was gibt der folgende Code auf dem Bildschirm aus?"}, {"b": 1, "code": "print(-7 % 3)", "p": "What is the output of the following code?", "o": ["-1", "1", "2", "-2"], "a": 2, "kid": "Bei % hat der Rest immer das Vorzeichen der RECHTEN Zahl. Rechts steht 3 (positiv), also ist der Rest positiv: 2.", "tech": "a % b = a - b*(a//b) = -7 - 3*(-3)... genauer: -7//3 = -3 → -7 - (-9) = 2.", "trap": true, "run": true, "v": "both", "id": 4, "de": "Was gibt der folgende Code auf dem Bildschirm aus?"}, {"b": 1, "code": "print(2 ** 3 ** 2)", "p": "What is the output of the following code?", "o": ["64", "512", "36", "12"], "a": 1, "kid": "** ist der einzige Rebell, der von RECHTS nach links rechnet: erst 3**2 = 9, dann 2**9 = 512.", "tech": "Der Potenzoperator ist rechtsassoziativ: 2 ** (3 ** 2) = 2 ** 9 = 512.", "trap": true, "run": true, "v": "both", "id": 5, "de": "Was gibt der folgende Code auf dem Bildschirm aus?"}, {"b": 1, "code": "print(-2 ** 2)", "p": "What is the output of the following code?", "o": ["4", "-4", "0.25", "Error"], "a": 1, "kid": "Erst wird potenziert (2**2 = 4), DANN kommt das Minus davor. Das Minus ist zu langsam!", "tech": "** bindet stärker als das unäre Minus links davon: -(2**2) = -4.", "trap": true, "run": true, "v": "both", "id": 6, "de": "Was gibt der folgende Code auf dem Bildschirm aus?"}, {"b": 1, "code": "print(2 ** -1)", "p": "What is the output of the following code?", "o": ["-2", "0.5", "Error", "0"], "a": 1, "kid": "Hoch minus 1 heißt: 1 geteilt durch die Zahl. 1/2 = 0.5.", "tech": "Negativer Exponent → Kehrwert, Ergebnis ist float: 0.5.", "trap": false, "run": true, "v": "both", "id": 7, "de": "Was gibt der folgende Code auf dem Bildschirm aus?"}, {"b": 1, "code": "print(0b101 + 0o10 + 0x1)", "p": "What is the output of the following code?", "o": ["111", "14", "12", "Error"], "a": 1, "kid": "0b = Binär (101 = 5), 0o = Oktal (10 = 8), 0x = Hexadezimal (1 = 1). 5 + 8 + 1 = 14.", "tech": "Präfixe: 0b binär, 0o oktal, 0x hex. print zeigt immer dezimal.", "trap": false, "run": true, "v": "both", "id": 8, "de": "Was gibt der folgende Code auf dem Bildschirm aus?"}, {"b": 1, "code": "print(1e3)", "p": "What is the output of the following code?", "o": ["1000", "1000.0", "1e3", "3"], "a": 1, "kid": "1e3 heißt 1 mal 10 hoch 3. Und alles mit e ist automatisch eine Kommazahl.", "tech": "Wissenschaftliche Notation erzeugt immer float: 1000.0.", "tra function hl(code){
  const KW=/^(def|return|if|elif|else|for|while|in|not|and|or|break|continue|pass|try|except|finally|global|import|is|True|False|None|with|as|del|lambda)$/;
  const BI=/^(print|range|len|int|float|str|list|type|input|sorted|tuple|dict|set|bool|round|ord|chr)$/;
  const re=/(#.*$)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(\b\d[\d_]*(?:\.\d+)?(?:e\d+)?\b|\b0[box][0-9a-fA-F]+\b)|([A-Za-z_]\w*)/gm;
  let out="",last=0,m;
  while((m=re.exec(code))){
    out+=esc(code.slice(last,m.index));
    const t=m[0];
    if(m[1]) out+=`<span class="co">${esc(t)}</span>`;
    else if(m[2]) out+=`<span class="st">${esc(t)}</span>`;
    else if(m[3]) out+=`<span class="nu">${esc(t)}</span>`;
    else if(KW.test(t)) out+=`<span class="kw">${t}</span>`;
    else if(BI.test(t)) out+=`<span class="bi">${t}</span>`;
    else out+=esc(t);
    last=m.index+t.length;
  }
  return out+esc(code.slice(last));
}
function optHTML(s, showDe){
  let base = "";
  if(!s.includes("\n")) base = esc(s);
  else base = s.split("\n").map(l=>l===""?'<span class="el">(leere Zeile)</span>':esc(l)).join("\n");
  if(showDe && OPT_DE[s]){
    base += `<span class="ode">🇩🇪 ${esc(OPT_DE[s])}</span>`;
  }
  return base;
}
function save(){LS.set("stats",stats);LS.set("wrong",wrongBox);LS.set("streak",streak);LS.set("autoDe",autoDe);updateHeaderUI();}
function record(q,ok){
  const s=stats[q.id]||[0,0]; s[0]++; if(ok)s[1]++; stats[q.id]=s;
  if(ok) streak++; else streak=0;
  if(!ok){ if(!wrongBox.includes(q.id)) wrongBox.push(q.id); }
  else if(state && state.mode==="box"){ wrongBox=wrongBox.filter(x=>x!==q.id); }
  save();
}

    <div class="qhead">
      <div><span class="pill">Prüfungsfrage ${s.i+1} von ${s.qs.length}</span> <span class="pill b${q.b}">Block ${q.b}</span></div>
      <button class="btn cyan" style="padding:5px 11px;font-size:12px" data-act="toggleDeExam">🇩🇪 ${showDeCurrent?"DE aus":"DE-Hilfe"}</button>
    </div>
    <div class="qp">${esc(q.p)}</div>
    ${showDeCurrent ? `<div class="qde">🇩🇪 <b>Auf Deutsch:</b> ${esc(q.de)}</div>` : ""}
    ${q.code?`<pre class="code">${hl(q.code)}</pre>`:""}
    <div class="opts">${order.map((oi,k)=>`<button class="opt ${s.ans[s.i]===k?"sel":""}" data-k="${k}"><span class="k">${"ABCD"[k]}</span><span class="v">${optHTML(q.o[oi], showDeCurrent)}</span></button>`).join("")}</div>
    <div class="actions"><button class="btn" data-act="prev" ${s.i===0?"disabled":""}>← Zurück</button>
    <button class="btn ghost" data-act="flag">${s.flags[s.i]?"🚩 Markiert":"🏳️ Zum Prüfen markieren"}</button>
    <div class="spacer"></div>
    ${s.i<s.qs.length-1?`<button class="btn main" data-act="enext">Weiter →</button>`:`<button class="btn main" data-act="submit">Prüfung abgeben 🏁</button>`}</div>
    <div class="navdots">${s.qs.map((_,j)=>`<button data-go="${j}" class="${s.ans[j]!==null?"ans":""} ${j===s.i?"cur":""} ${s.flags[j]?"flag":""}">${j+1}</button>`).join("")}</div>
    </div>`;
  tick();
}
function askSubmit(){
  const open=state.ans.filter(a=>a===null).length;
  const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="box"><h3>Prüfung jetzt abgeben?</h3><p class="hint" style="font-size:15px">${open?`Du hast noch <b>${open}</b> Fragen unbeantwortet! Unbeantwortete Fragen zählen als falsch.`:"Alle Fragen sind beantwortet. Bereit für die Auswertung?"}</p>
  <div class="actions"><button class="btn main" id="yes">Ja, jetzt auswerten 🏁</button><button class="btn ghost" id="no">Weiter prüfen</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector("#yes").onclick=()=>{m.remove();finishExam();};
  m.querySelector("#no").onclick=()=>m.remove();
}
function finishExam(){
  stopTimer(); const s=state; if(!s||s.mode!=="exam") return;
  const res=s.qs.map((q,i)=>{const k=s.ans[i];const ok=k!==null&&s.orders[i][k]===q.a;return {q,ok,k};});
  res.forEach(r=>record(r.q,r.ok));
  const right=res.filter(r=>r.ok).length; const p=Math.round(right/res.length*100); const pass=p>=70;
  const used=Math.max(1, Math.round((EXAM[ver].min*60000-Math.max(0,s.end-Date.now()))/60000));
  const per={}; res.forEach(r=>{per[r.q.b]=per[r.q.b]||[0,0];per[r.q.b][1]++;if(r.ok)per[r.q.b][0]++;});
  let h=`<div class="qbox result"><div class="pct" style="color:${pass?"var(--green)":"var(--red)"}">${p}%</div>
  <div class="verdict">${pass?"🎉 BESTANDEN! Die Kohlenstoffeinheit ist PCEP-Ready!":"Noch knapp unter 70% – alle Fehler liegen jetzt in deiner Fehler-Kiste! 💪"}</div>
  <div class="hint">${right} von ${res.length} Punkten · Zum Bestehen nötig: ${Math.ceil(res.length*0.7)} (70%) · Gebrauchte Zeit: ~${used} Min</div>
  <div class="breaks">${Object.keys(per).sort().map(b=>`<div class="brow"><div class="n">${BLOCKS[b].e} Block ${b} (${BLOCKS[b].w})</div><div class="bar"><i style="width:${per[b][0]/per[b][1]*100}%;background:${per[b][0]/per[b][1]>=.7?"var(--green)":"var(--red)"}"></i></div><div style="width:45px;text-align:right;font-weight:700">${per[b][0]}/${per[b][1]}</div></div>`).join("")}</div>
  <div class="actions" style="justify-content:center"><button class="btn main" data-act="exam">🔄 Neue Prüfungssimulation</button><button class="btn" data-act="box">📦 Fehler-Kiste üben</button><button class="btn ghost" data-act="home">← Menü</button></div></div>`;
  const wrong=res.filter(r=>!r.ok);
  if(wrong.length){
    h+=`<div class="section-t"><span>Deine ${wrong.length} Fehler mit Erklärung</span></div><div class="review">`;
    wrong.forEach(r=>{const q=r.q;const yours=r.k===null?"(keine Antwort gewählt)":q.o[s.orders[s.qs.indexOf(q)][r.k]];
      h+=`<div class="ritem"><span class="pill b${q.b}">Block ${q.b}</span> ${q.trap?'<span class="pill trap">🪤 Fangfrage</span>':''}
      <div class="qp" style="font-size:16px">${esc(q.p)}</div>
      <div class="qde" style="font-size:13px">🇩🇪 ${esc(q.de)}</div>
      ${q.code?`<pre class="code">${hl(q.code)}</pre>`:""}
      <div style="color:var(--red);margin-bottom:4px">❌ Deine Wahl: <span style="font-family:'JetBrains Mono',monospace;white-space:pre-wrap">${optHTML(yours,false)}</span></div>
      <div style="color:var(--green);margin-bottom:8px">✅ Richtig: <span style="font-family:'JetBrains Mono',monospace;white-space:pre-wrap">${optHTML(q.o[q.a],false)}</span></div>
      <div class="row" style="display:flex;gap:8px;margin-top:8px;background:#0003;padding:8px 10px;border-radius:10px"><span>👶</span><span>${esc(q.kid)}</span></div>
      <div class="row" style="display:flex;gap:8px;margin-top:6px;color:var(--mute);padding:4px 10px"><span>🤓</span><span>${esc(q.tech)}</span></div></div>`;});
    h+=`</div>`;
  }
  state={mode:"examdone"};
  $app.innerHTML=h; window.scrollTo({top:0});
}

/* ---------- CHEAT & VOCAB ---------- */
function renderCheat(){
  stopTimer(); state={mode:"cheat"};
  let body = "";
  if(cheatTab === "traps"){
    body = `<div class="cheat">${CHEAT.map((c,i)=>`<div class="ci"><div class="no">${i+1}</div><div>${c[0]} <span class="pill b${c[1]}">Block ${c[1]}</span></div></div>`).join("")}</div>`;
  } else if(cheatTab === "vocab"){
    body = `<div class="vocab-grid">${VOCAB.map(v=>`<div class="vcard"><div class="en">"${esc(v[0])}"</div><div class="de">🇩🇪 ${esc(v[1])}</div></div>`).join("")}</div>`;
  } else {
    body = `<div class="qbox" style="space-y:14px">
      <h3 style="color:var(--yellow);margin-bottom:10px">⚡ 1. Die heilige Operator-Rangfolge (von stark nach schwach)</h3>
      <pre class="code">1. ()                  Klammern zuerst!
2. **                  Potenz (Achtung: von RECHTS nach LINKS! 2**3**2 = 512)
3. +x, -x, ~x          Unäres Plus/Minus und Bit-NOT (~5 = -6)
4. *, /, //, %         Punkt-Rechnung (/, //, Modulo %)
5. +, -                Strich-Rechnung
6. &lt;&lt;, &gt;&gt;              Bit-Shifts (x &lt;&lt; 1 verdoppelt, x &gt;&gt; 1 halbiert)
7. &amp;                   Bitweises UND
8. ^                   Bitweises XOR (unterschiedlich = 1)
9. |                   Bitweises ODER
10. ==, !=, &lt;, &gt;, in, is   Vergleiche
11. not                Logisches NICHT
12. and                Logisches UND (bindet stärker als or!)
13. or                 Logisches ODER</pre>
      <h3 style="color:var(--green);margin:18px 0 10px">🌳 2. Der Python Exception-Stammbaum (Wer fängt wen?)</h3>
      <pre class="code">BaseException                  &lt;-- Ur-Oma ganz oben!
 ├── SystemExit                (durch sys.exit())
 ├── KeyboardInterrupt         (wenn Nutzer Strg+C drückt)
 └── Exception                 &lt;-- Normale Fehler-Mama
      ├── ArithmeticError      &lt;-- Chef aller Rechenfehler
      │    └── ZeroDivisionError   (1 / 0 oder 1 // 0 oder 1 % 0)
      ├── LookupError          &lt;-- Chef aller "Nicht gefunden"-Fehler!
      │    ├── IndexError          (Liste/Tupel/String Index zu groß: [1,2][9])
      │    └── KeyError            (Schlüssel im Dict fehlt: d['gibts_nicht'])
      ├── TypeError            (Falscher Datentyp: '5' + 5 oder len(5) oder (1,2)[0]=9)
      ├── ValueError           (Richtiger Typ, aber Inhalt Quatsch: int('abc') oder int('3.5'))
      └── NameError            (Variable existiert nicht)
           └── UnboundLocalError   (Lokale Variable in Funktion vor Zuweisung gelesen)</pre>
    </div>`;
  }
  $app.innerHTML=`<div class="top"><button class="btn ghost" data-act="home">← Menü</button><h2 style="font-size:22px">📜 Ultimativer Spickzettel &amp; Englisch-Hilfe</h2></div>
  <div class="tabs">
    <button data-ctab="traps" class="${cheatTab==="traps"?"on":""}">🪤 Die 25 Lieblingsfallen</button>
    <button data-ctab="vocab" class="${cheatTab==="vocab"?"on":""}">🇬🇧 Englisch-Überlebens-Wörterbuch</button>
    <button data-ctab="tree" class="${cheatTab==="tree"?"on":""}">🌳 Rangfolge &amp; Fehler-Stammbaum</button>
  </div>
  ${body}
  <div class="actions" style="justify-content:center;margin-top:20px"><button class="btn main" data-act="traps">Jetzt alle Fangfragen trainieren 🪤</button></div>`;
  window.scrollTo({top:0});
}

/* ---------- EVENTS ---------- */
let lastLearn=null;
function launch(act,b){
  const P=pool();
  if(act==="learn"){
    if(b==="all"){lastLearn=()=>startLearn(shuffle(P).slice(0,20),"learn","Gemischt (20)");}
    else {lastLearn=()=>startLearn(shuffle(P.filter(q=>String(q.b)===b)),"learn","Block "+b);}
    lastLearn();
  } else if(act==="traps"){lastLearn=()=>startLearn(shuffle(P.filter(q=>q.trap)),"traps","Fangfragen");lastLearn();}
  else if(act==="box"){const ids=wrongBox.filter(id=>P.some(q=>q.id===id));lastLearn=()=>startLearn(shuffle(BANK.filter(q=>ids.includes(q.id))),"box","Fehler-Kiste");lastLearn();}
}
document.addEventListener("click",e=>{
  const v=e.target.closest("#verSeg button");
  if(v){ if(state&&state.mode==="exam") return; ver=v.dataset.v; LS.set("ver",ver); renderHome(); return; }
  const dt=e.target.closest("#deToggle");
  if(dt){
    autoDe=!autoDe; showDeCurrent=autoDe; save();
    if(state&&(state.mode==="learn"||state.mode==="traps"||state.mode==="box")&&!state.ended){ if(!state.answered) drawLearnQ(); }
    else if(state&&state.mode==="exam") renderExamQ();
    return;
  }
  const ct=e.target.closest("[data-ctab]");
  if(ct){ cheatTab=ct.dataset.ctab; renderCheat(); return; }
  if(e.target.closest("#logo")){ if(state&&state.mode==="exam") return; renderHome(); return; }
  const go=e.target.closest("[data-go]");
  if(go&&state&&state.mode==="exam"){state.i=+go.dataset.go;renderExamQ();return;}
  const opt=e.target.closest(".opt");
  if(opt&&!opt.disabled&&state){
    const k=+opt.dataset.k;
    if(state.mode==="exam"){state.ans[state.i]=k;renderExamQ();}
    else answerLearn(k);
    return;
  }
  const a=e.target.closest("[data-act]"); if(!a||a.disabled) return;
  const act=a.dataset.act;
  if(act==="home") renderHome();
  else if(["learn","traps","box"].includes(act)) launch(act,a.dataset.b);
  else if(act==="cheat") renderCheat();
  else if(act==="exam") startExam();
  else if(act==="next") nextLearn();
  else if(act==="again") lastLearn&&lastLearn();
  else if(act==="toggleDe"){
    showDeCurrent=!showDeCurrent;
    if(!state.answered) drawLearnQ();
    else {
      const exDe=document.querySelector(".qde");
      if(exDe) exDe.remove();
      else {
        const qp=document.querySelector(".qp");
        if(qp) qp.insertAdjacentHTML("afterend", `<div class="qde">🇩🇪 <b>Auf Deutsch:</b> ${esc(state.qs[state.i].de)}</div>`);
      }
    }
  }
  else if(act==="toggleDeExam"){showDeCurrent=!showDeCurrent;renderExamQ();}
  else if(act==="prev"){state.i--;renderExamQ();}
  else if(act==="enext"){state.i++;renderExamQ();}
  else if(act==="flag"){state.flags[state.i]=!state.flags[state.i];renderExamQ();}
  else if(act==="submit") askSubmit();
  else if(act==="quitExam"){stopTimer();renderHome();}
  else if(act==="reset"){
    const m=document.createElement("div");m.className="modal";
    m.innerHTML=`<div class="box"><h3>Lernstand wirklich zurücksetzen?</h3><p class="hint" style="font-size:15px">Dein Fortschritt, dein Rang und die Fehler-Kiste werden auf 0 gesetzt.</p><div class="actions"><button class="btn main" id="yes">Ja, löschen</button><button class="btn ghost" id="no">Abbrechen</button></div></div>`;
    document.body.appendChild(m);
    m.querySelector("#yes").onclick=()=>{stats={};wrongBox=[];streak=0;save();m.remove();renderHome();};
    m.querySelector("#no").onclick=()=>m.remove();
  }
});
document.addEventListener("keydown",e=>{
  if(!state||document.querySelector(".modal")) return;
  const key=e.key.toLowerCase();
  if(key==="ü"||key==="t"){
    if(state.mode==="exam"){showDeCurrent=!showDeCurrent;renderExamQ();return;}
    if((state.mode==="learn"||state.mode==="traps"||state.mode==="box")&&!state.ended){
      const btn=document.querySelector("[data-act='toggleDe']");
      if(btn) btn.click();
      return;
    }
  }
  const map={"1":0,"2":1,"3":2,"4":3,"a":0,"b":1,"c":2,"d":3};
  const k=map[key];
  if((state.mode==="learn"||state.mode==="traps"||state.mode==="box")&&!state.ended){
    if(k!==undefined&&!state.answered){e.preventDefault();answerLearn(k);}
    else if(e.key==="Enter"&&state.answered){e.preventDefault();nextLearn();}
  } else if(state.mode==="exam"){
    if(k!==undefined){state.ans[state.i]=k;renderExamQ();}
    else if(e.key==="ArrowRight"&&state.i<state.qs.length-1){state.i++;renderExamQ();}
    else if(e.key==="ArrowLeft"&&state.i>0){state.i--;renderExamQ();}
  }
});
renderHome();
</script>
</body>
